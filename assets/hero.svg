<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="860" height="392" viewBox="0 0 860 392" role="img" aria-labelledby="title desc">
  <title id="title">Andersson Quintero, Senior Full-Stack Engineer</title>
  <desc id="desc">A Neovim window showing about.ts: Andersson Quintero is a Senior Full-Stack Engineer in Buenos Aires, Argentina, with 9+ years in web and mobile. He builds products, APIs and developer tools, focuses on clean architecture and great DX, and is open to freelance, full-time and open source work.</desc>
  <style>
    text { white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .fg { fill: #c0caf5; } .kw { fill: #bb9af7; } .str { fill: #9ece6a; } .prop { fill: #7dcfff; }
    .cm { fill: #828bb8; font-style: italic; } .nr { fill: #3b4261; text-anchor: end; } .pn { fill: #89ddff; }
    .tab { font-size: 13px; fill: #828bb8; } .tab-on { font-size: 13px; fill: #c0caf5; }
    .sl { font-size: 13px; fill: #a9b1d6; } .mode { font-size: 13px; font-weight: 700; fill: #1a1b26; }
    .line { animation: type 0.35s ease-out backwards; }
    .cursor { fill: #c0caf5; animation: blink 1.1s steps(1) infinite; }
    @keyframes type { from { opacity: 0; transform: translateX(-6px); } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .line, .cursor { animation: none; } }
  </style>

